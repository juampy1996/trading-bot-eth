name: Bot Trading Automatico

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Librerías
      run: |
        python -m pip install --upgrade pip
        pip install ccxt pandas numpy requests

    - name: Ejecutar Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -f "bot_github.py" ]; then python bot_github.py; fi
        if [ -f "bot_eth.py" ]; then python bot_eth.py; fi

    - name: Guardar Cambios en GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "bot@github.com"
        git add estado_bot.json historial_trades.csv
        git commit -m "Auto-update estado e historial bot" || exit 0
        git push
