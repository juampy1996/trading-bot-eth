name: Bot Trading Automatico ETH

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Librerías
      run: |
        python -m pip install --upgrade pip
        pip install ccxt pandas numpy

    - name: Ejecutar Bot ETH
      run: python bot_eth.py

    - name: Guardar Cambios del Estado e Historial en GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "bot@github.com"
        git add estado_bot.json historial_trades.csv
        git commit -m "Auto-update estado e historial bot ETH" || exit 0
        git push
